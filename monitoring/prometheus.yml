# Prometheus Configuration for The Autonomous Alpha

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Trading agent metrics
  - job_name: 'trading-agent'
    static_configs:
      - targets: ['trading-agent:8080']
    metrics_path: /metrics

  # Qdrant vector database
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
